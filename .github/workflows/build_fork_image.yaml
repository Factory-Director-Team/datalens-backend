name: Build Fork Backend Images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: datalens-control-api
            bake_target: dl_control_api
          - image_name: datalens-data-api
            bake_target: dl_data_api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push
        working-directory: docker_build
        env:
          BAKE_TARGET: ${{ matrix.bake_target }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # metadata-action отдаёт теги через перевод строки; bake требует их
          # одной строкой через запятую — иначе повторные --set перезатирают друг друга.
          TAGS_CSV=$(printf '%s\n' "${IMAGE_TAGS}" | grep -v '^$' | paste -sd, -)
          ./run-project-bake "${BAKE_TARGET}" \
            --push \
            --set "*.platform=linux/amd64" \
            --set "*.cache-from=type=gha,scope=${BAKE_TARGET}" \
            --set "*.cache-to=type=gha,mode=max,scope=${BAKE_TARGET}" \
            --set "${BAKE_TARGET}.tags=${TAGS_CSV}"
